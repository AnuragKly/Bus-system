name: bus_tracking_app
description: Bus tracking frontend using OpenStreetMap

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  provider: ^6.0.0
  geolocator: ^8.2.0

flutter:
  assets:
    - assets/images/bus.png
  
  # Enable Material Design
  uses-material-design: true
  