name: bus_tracking_app
description: Bus tracking frontend using OpenStreetMap

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  provider: ^6.0.0
  geolocator: ^8.2.0
  cached_network_image: ^3.2.0
  flutter_cache_manager: ^3.3.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2

flutter:
  assets:
    - assets/images/bus.png
  